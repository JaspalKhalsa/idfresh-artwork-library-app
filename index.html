<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#037D70">
<title>iD Fresh Artwork Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --frame:#037D70; --frame-ink:#FFFFFF; --frame-muted:#D6EEEA; --frame-pill:rgba(0,0,0,.24);
  --canvas:#F3F3F1; --card:#FFFFFF; --soft:#EDEDEA; --field:#E7E7E4; --line:#DCDCD7;
  --ink:#111111; --muted:#4F4F4F; --on-pastel:#111111;
  --lime:#D9F26B; --mint:#CDEFD5; --lilac:#E7D7FB; --sky:#D3EEF8; --butter:#FBEBB0; --peach:#FBD3C0; --rose:#FDE3DF;
  --late:#A3200F; --btn:#111111; --btn-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#181818; --card:#232323; --soft:#2C2C2C; --field:#2C2C2C; --line:#3A3A3A;
    --ink:#F2F2F2; --muted:#B5B5B5;
    --lime:#CFE85A; --mint:#A9D9B4; --lilac:#CDB8EE; --sky:#AED8E8; --butter:#E9D58A; --peach:#E9B39B; --rose:#F0B8AE;
    --late:#7A1608; --btn:#F2F2F2; --btn-ink:#111111;
  }
}
:root[data-theme="dark"]{
  --canvas:#181818; --card:#232323; --soft:#2C2C2C; --field:#2C2C2C; --line:#3A3A3A;
  --ink:#F2F2F2; --muted:#B5B5B5;
  --lime:#CFE85A; --mint:#A9D9B4; --lilac:#CDB8EE; --sky:#AED8E8; --butter:#E9D58A; --peach:#E9B39B; --rose:#F0B8AE;
  --late:#7A1608; --btn:#F2F2F2; --btn-ink:#111111;
}
*{box-sizing:border-box}
body{margin:0;background:var(--frame);color:var(--ink);font-family:Urbanist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{min-height:100vh;padding:0 10px 10px;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 14px;color:var(--frame-ink)}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--frame-ink)}
.brand b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:15px;color:var(--frame-muted)}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;color:#EAF6F4;text-decoration:none;font-size:15px;font-weight:500}
.nav a[aria-current="page"]{background:var(--frame-pill);color:#FFF;font-weight:700}
.nav .count{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#D9F26B;color:#111}
.who{display:flex;align-items:center;gap:10px}
.who select{background:var(--frame-pill);color:#FFF;border:none;border-radius:999px;min-height:44px;padding:0 14px;font-weight:600;max-width:220px}
.rolesel{background:var(--soft);border:none;border-radius:999px;min-height:44px;padding:0 14px;font-weight:700;color:var(--ink)}
.who select:disabled{opacity:1;cursor:default;-webkit-appearance:none;appearance:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:none;cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn-dark{background:var(--btn);color:var(--btn-ink)}
.btn-lime{background:#D9F26B;color:#111}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-white{background:#FFFFFF;color:#111}
.btn-wa{background:#25D366;color:#111}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7A9A1E;outline-offset:2px}
.canvas{flex:1 1 auto;background:var(--canvas);border-radius:30px;padding:clamp(16px,3vw,36px);display:flex;flex-direction:column;gap:22px;min-width:0}
h1{margin:0;font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{margin:4px 0 0;font-size:17px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{border-radius:22px;padding:12px 18px;min-width:96px;text-align:center;color:var(--on-pastel)}
.tile b{display:block;font-size:30px;font-weight:800;line-height:1}
.tile span{font-size:13px;font-weight:700}
.tile.dash{border:2px dashed var(--line);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;border:none;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.chip[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.chip .n{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip[aria-selected="true"] .n{background:#D9F26B;color:#111}
.search{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:999px;padding:0 18px;min-height:48px;flex:0 1 360px}
.search input{border:none;outline:none;background:transparent;font-size:15px;flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:28px;padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.card.hot{background:var(--lime);color:var(--on-pastel)}
.card.hot .meta{color:#333}
.thumb{width:72px;height:72px;border-radius:22px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:#111;overflow:hidden;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb em{font-style:normal;font-size:12px;font-weight:800;background:#FFF;padding:2px 7px;border-radius:999px;position:relative}
.title{font-size:19px;font-weight:800;letter-spacing:-.01em;text-decoration:none;color:inherit}
.meta{font-size:14px;color:var(--muted)}
.bar{display:flex;gap:4px}
.bar i{height:8px;flex:1;border-radius:999px;background:var(--line)}
.bar i.d{background:var(--ink)} .card.hot .bar i.d{background:#111}
.bar i.c{background:#7A9A1E}
.av{display:flex}
.av span{width:36px;height:36px;border-radius:999px;border:3px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#111;margin-left:-10px}
.av span:first-child{margin-left:0}
.card.hot .av span{border-color:var(--lime)}
.pill{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;color:#111}
.p-late{background:var(--rose)} .p-late{color:#5C1208}
.p-today{background:var(--butter)} .p-ok{background:var(--soft);color:var(--ink)} .p-live{background:var(--mint)}
.empty{background:var(--card);border-radius:28px;padding:44px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{font-size:20px}
.split{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:12px}
.pastel{border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:8px;color:var(--on-pastel)}
.pastel .hd{display:flex;justify-content:space-between;padding:8px 12px 0;font-weight:700;font-size:15px}
.pastel .bd{background:rgba(255,255,255,.55);border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.45}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stages li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:24px;border:2px dashed var(--line);color:var(--muted)}
.stages li.done{background:var(--card);border-color:transparent;color:var(--ink)}
.stages li.cur{background:var(--btn);border-color:transparent;color:var(--btn-ink)}
.stages .dot{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--field);color:var(--ink);flex:0 0 auto}
.stages li.done .dot{background:var(--mint);color:#111}
.stages li.cur .dot{background:#D9F26B;color:#111}
.stages b{display:block;font-size:15px}
.stages small{font-size:13px;font-weight:600;opacity:.85}
.art{background:var(--lilac);border-radius:30px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--on-pastel)}
.stage-box{background:#FFFFFF;border-radius:22px;min-height:220px;display:flex;align-items:center;justify-content:center;padding:20px;color:#111;overflow:hidden}
.stage-box img{max-width:100%;max-height:560px;border-radius:12px}
.stage-box.has-art{min-height:420px}
.next{background:var(--lime);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:12px;color:var(--on-pastel)}
.next .k{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.next .t{font-size:24px;font-weight:800;line-height:1.1}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFF;color:#111;border-radius:22px;padding:18px;border:2px dashed #9DB436;cursor:pointer;text-align:center}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.fileline{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--soft);border-radius:20px;padding:10px 12px}
.ext{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#111;flex:0 0 auto}
.person{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;background:var(--soft)}
.person .ini{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#111;flex:0 0 auto}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feed li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.feed .b{width:12px;height:12px;border-radius:999px;border:2px solid var(--ink);margin-top:4px;flex:0 0 auto}
.feed small{display:block;color:var(--muted);font-size:13px}
.compose{display:flex;gap:8px;background:var(--soft);border-radius:999px;padding:6px 6px 6px 18px;align-items:center}
.compose input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lib{background:var(--card);border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:10px}
.lib .pv{aspect-ratio:4/3;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#111;position:relative;overflow:hidden}
.lib .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lib .pv > *{position:relative}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#FFF;color:#111}
.tag.dark{background:#111;color:#FFF}
.bars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:14px;font-weight:700}
.hb .tr{height:22px;border-radius:999px;background:var(--soft);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--ink);border-radius:999px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.modal{background:var(--canvas);border-radius:30px;padding:24px;width:min(720px,100%);display:flex;flex-direction:column;gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:46px;padding:10px 14px;font-weight:500;font-size:15px}
.f textarea{min-height:90px;resize:vertical}
.f.full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.err{color:var(--late);font-weight:700;font-size:14px}
:root[data-theme="dark"] .err{color:#F0B8AE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#F0B8AE}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#FFF;padding:12px 20px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.banner{background:var(--butter);color:#111;border-radius:20px;padding:10px 16px;font-size:14px;font-weight:600}
.checkbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.checkbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chkbtn{display:flex;align-items:center;gap:10px;text-align:left;min-height:56px;padding:10px 12px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chkbtn:hover:not(:disabled){border-color:var(--ink)}
.chkbtn:disabled{cursor:not-allowed;opacity:.6}
.chkbtn.busy{border-color:#037D70;opacity:1}
.chkbtn b{display:block;font-size:15px;font-weight:800}
.chkbtn small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.chk-t{min-width:0}
.dot{width:14px;height:14px;border-radius:999px;flex:0 0 auto;border:2px solid var(--line);background:var(--card)}
.dot-pass{background:#3BAA6B;border-color:#3BAA6B}.dot-warn{background:#E0A13A;border-color:#E0A13A}.dot-fail{background:#D0402B;border-color:#D0402B}
.chkbtn.busy .dot{border-color:#037D70;border-top-color:transparent;background:transparent;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.chkbtn.busy .dot{animation:none}}
.chk{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:22px;padding:14px 16px}
.chk .hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:16px}
.chk ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.45}
.st{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;color:#111;white-space:nowrap}
.st-pass{background:var(--mint)} .st-warn{background:var(--butter)} .st-fail{background:var(--rose)} .st-na{background:var(--field);color:var(--ink)}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.2);vertical-align:-3px;margin-right:6px}
@media (max-width:640px){.who .nm{display:none}.hb{grid-template-columns:100px minmax(0,1fr) 36px}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/work"><img src="logo-white.png" alt="iD Fresh Artwork Library" style="height:44px;width:auto;display:block"></a>
    <nav class="nav" aria-label="Main" id="nav"></nav>
    <div class="who">
      <button class="btn btn-lime" data-act="new">+ New request</button>
      <label class="sr" for="me">Your name</label>
      <select id="me" aria-label="Your name"></select>
      <a class="btn" style="background:rgba(0,0,0,.24);color:#FFF" href="#/password">Password</a>
      <button class="btn" style="background:rgba(0,0,0,.24);color:#FFF" data-act="signout">Sign out</button>
    </div>
  </header>
  <main class="canvas" id="view" aria-live="polite"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var TEAM = [
  ['Jaspal Khalsa','Creative'],['Ritesh','Creative'],['Rafeeq','Creative'],['Paul','Creative'],
  ['Dhanad','Marketing'],['Deepika Das','Marketing'],['Subhrojeet Mukherjee','Marketing'],['Bharath Ram Ganapathy','Marketing'],
  ['Yogesh Sadashiv','Quality'],['Koushik Bharadwaj','Quality'],['Chandana Jois','Manufacturing'],['Vandana Kothari','Legal']
];
var DEPT = {}; TEAM.forEach(function(t){ DEPT[t[0]] = t[1]; });
/* ---------- Team, roles and permissions ---------- */
var ROLES = {
  admin:     { label: 'Admin',     who: 'Creative & brand leads',           copy: 'Full access. Manages the team and invites, check settings, and can do every project action.' },
  requester: { label: 'Requester', who: 'Marketing',                        copy: 'Starts artwork requests, writes briefs, tracks progress and nudges people. Can view and download everything.' },
  designer:  { label: 'Designer',  who: 'Creative team and agencies',       copy: 'Uploads artwork versions, runs the artwork checks and hands over final print-ready files.' },
  approver:  { label: 'Approver',  who: 'Quality, Legal, Manufacturing',    copy: 'Reviews artwork, runs the checks, and approves or requests changes with a reason.' },
  viewer:    { label: 'Viewer',    who: 'Sales, printers, leadership',      copy: 'Views projects and downloads approved files from the Library. Can’t change anything.' }
};
var ROLE_ORDER = ['admin', 'requester', 'designer', 'approver', 'viewer'];
var DEPTS = ['Creative', 'Marketing', 'Quality', 'Legal', 'Manufacturing', 'Sales', 'Agency', 'Other'];
var CAN = {
  admin:     ['request', 'design', 'approve', 'check', 'note', 'nudge', 'upload', 'settings', 'team'],
  requester: ['request', 'note', 'nudge', 'upload'],
  designer:  ['request', 'design', 'check', 'note', 'nudge', 'upload'],
  approver:  ['approve', 'check', 'note', 'nudge'],
  viewer:    []
};
function can(a){ return (CAN[S.role] || []).indexOf(a) >= 0; }
function applyTeam(rows){
  S.team = (rows || []).slice().sort(function(a, b){ return String(a.full_name).localeCompare(String(b.full_name)); });
  if (S.team.length){
    TEAM = S.team.map(function(r){ return [r.full_name, r.department || '', r.email, r.role]; });
    DEPT = {}; TEAM.forEach(function(t){ DEPT[t[0]] = t[1]; });
  }
  var mine = S.team.find(function(r){ return String(r.email).toLowerCase() === String(S.email || '').toLowerCase(); });
  if (mine){ S.me = mine.full_name; S.role = ROLES[mine.role] ? mine.role : 'viewer'; S.meLocked = true; if (S.mode === 'notinvited') S.mode = 'live'; }
  else if (S.mode === 'live'){ S.mode = 'notinvited'; }
  fillMe(); render();
}
function loadTeam(){
  return sb.from('team').select('email, full_name, department, role, invited_at, invited_by').then(function(r){
    if (r.error){ toast('Couldn’t load the team — ' + r.error.message); return; }
    applyTeam(r.data);
  });
}
function peopleWith(roles){ return (S.team || []).filter(function(r){ return roles.indexOf(r.role) >= 0; }).map(function(r){ return r.full_name; }); }
function sendInvites(emails){
  if (!emails.length) return Promise.resolve();
  toast('Sending ' + emails.length + ' invite' + (emails.length > 1 ? 's' : '') + '…');
  return sb.functions.invoke('invite-user', { body: { emails: emails, redirectTo: location.origin + location.pathname } }).then(function(r){
    if (r.error || (r.data && r.data.error)){ toast('Invites didn’t send — ' + ((r.data && r.data.error) || r.error.message)); return; }
    var res = (r.data && r.data.results) || [], okN = res.filter(function(x){ return x.ok; }).length, bad = res.filter(function(x){ return !x.ok; });
    toast(okN + ' invite' + (okN === 1 ? '' : 's') + ' sent' + (bad.length ? ' · ' + bad.length + ' failed: ' + bad.map(function(b){ return b.email + ' (' + b.error + ')'; }).join(', ') : '.'));
    loadTeam();
  });
}
function parseBulk(text){
  var out = [], errs = [];
  String(text || '').split('\n').forEach(function(line, i){
    var l = line.trim(); if (!l) return;
    var parts = l.split(/\t|,/).map(function(x){ return x.trim(); });
    var email = parts.find(function(x){ return /@/.test(x); });
    if (!email){ errs.push('Line ' + (i + 1) + ': no email'); return; }
    email = email.toLowerCase();
    if (email.slice(-COMPANY.length) !== COMPANY){ errs.push('Line ' + (i + 1) + ': ' + email + ' isn’t an @idfreshfood.com address'); return; }
    var rest = parts.filter(function(x){ return x && x.toLowerCase() !== email; });
    var role = rest.map(function(x){ return x.toLowerCase(); }).find(function(x){ return ROLES[x]; }) || 'viewer';
    var dept = rest.find(function(x){ return DEPTS.map(function(d){ return d.toLowerCase(); }).indexOf(x.toLowerCase()) >= 0; });

function viewLibrary(){
  var live = S.projects.filter(function(p){ return p.stage === 'live'; });
  var q = S.libq.trim().toLowerCase();
  var cats = ['All'].concat(CATS.filter(function(c){ return live.some(function(p){ return p.category===c; }); }));
  var list = live.filter(function(p){ return (S.lib==='All' || p.category===S.lib) && (!q || (p.product+' '+p.id+' '+(p.fgCode||'')).toLowerCase().indexOf(q)>=0); });
  var ready = live.filter(function(p){ return files(p,'source').length; }).length;
  var html = modeBanner() + '<div class="row" style="align-items:flex-end"><div><h1>Library</h1><p class="sub">The latest approved version of every pack. Always print-ready, never “final_final_v3”.</p></div>' +
    '<div class="tiles"><div class="tile" style="background:var(--mint)"><b>' + ready + '</b><span>Print-ready</span></div><div class="tile" style="background:var(--rose)"><b>' + (live.length - ready) + '</b><span>Source missing</span></div></div></div>';
  html += '<div class="row"><div class="chips" role="tablist" aria-label="Category">' + cats.map(function(c){ return '<button class="chip" role="tab" aria-selected="' + (S.lib===c) + '" data-act="lib" data-v="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
    '<label class="search"><span class="sr">Search the Library</span><input id="libq" type="search" placeholder="Search pack, AW number, FG code" value="' + esc(S.libq) + '"></label></div>';
  if (!list.length) return html + '<div class="empty"><b>' + (live.length ? 'No packs found' : 'The Library is empty') + '</b><span class="meta">' + (live.length ? 'Try another name, or pick “All”.' : 'Packs land here when their final files are handed over.') + '</span></div>';
  return html + '<div class="grid">' + list.map(function(p){
    var a = latestArt(p), src = files(p,'source');

    return '<article class="lib"><div class="pv" style="background:' + (CAT_COLOR[p.category]||'var(--mint)') + '">' + img + '<div class="row"><span class="tag">v' + esc(p.version||1) + '</span><span class="tag dark">' + esc(p.packType||'Pack') + '</span></div><div style="font-size:22px;font-weight:800;line-height:1.1">' + (img ? '' : esc(p.product.replace(/^iD Fresh\s*/i,''))) + '</div></div>' +
      '<div style="padding:0 8px"><a class="title" style="font-size:17px" href="#/p/' + encodeURIComponent(p.id) + '">' + esc(p.product) + '</a><div class="meta">' + esc(p.category||'') + ' · live since ' + fmtDate(p.stageSince) + '</div></div>' +
      '<div class="row" style="padding:0 4px 4px 8px"><span class="pill ' + (src.length ? 'p-live' : 'p-late') + '">' + (src.length ? 'Print-ready' : 'Source missing') + '</span><span style="display:flex;gap:6px">' + waIcon(p) +
      (dl ? '<button class="btn btn-dark" style="min-height:44px;padding:0 16px" data-act="dl" data-url="' + esc(fileUrl(dl)) + '" data-name="' + esc(dl.name) + '" aria-label="Download source for ' + esc(p.product) + '">Download</button>' : '') + '</span></div></article>';

}

function viewInsights(){
  var P = S.projects, open = P.filter(function(p){ return p.stage!=='live'; }), late = open.filter(function(p){ return due(p).late; });
  var byStage = STAGES.map(function(s){ return [s[1], P.filter(function(p){ return p.stage===s[0]; }).length]; });
  var maxS = Math.max.apply(null, byStage.map(function(x){ return x[1]; }).concat([1]));
  var holding = {}; open.forEach(function(p){ waitingOn(p).forEach(function(n){ holding[n] = (holding[n]||0)+1; }); });
  var hold = Object.keys(holding).map(function(k){ return [k, holding[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);
  var maxH = Math.max.apply(null, hold.map(function(x){ return x[1]; }).concat([1]));
  var reasons = {}; P.forEach(function(p){ (p.notes||[]).forEach(function(n){ if (n.kind==='change') reasons[n.reason||'Other'] = (reasons[n.reason||'Other']||0)+1; }); });
  var rs = Object.keys(reasons).map(function(k){ return [k, reasons[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  var withChanges = P.filter(function(p){ return (p.notes||[]).some(function(n){ return n.kind==='change'; }); }).length;
  var approvedAny = P.filter(function(p){ return stageIdx(p.stage) >= 3; });
  var rft = approvedAny.filter(function(p){ return !(p.notes||[]).some(function(n){ return n.kind==='change'; }); }).length;
  function bars(rows, max){ return '<div class="bars">' + rows.map(function(r){ return '<div class="hb"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r[0]) + '</span><span class="tr"><i style="width:' + (r[1]/max*100).toFixed(1) + '%"></i></span><span>' + r[1] + '</span></div>'; }).join('') + '</div>'; }
  return modeBanner() + '<div><h1>Insights</h1><p class="sub">Where artwork waits, and why it goes round again. Live from this Library.</p></div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">' +
    '<div class="tile" style="background:var(--sky);text-align:left;padding:20px"><b>' + P.length + '</b><span>Projects</span></div>' +
    '<div class="tile" style="background:var(--butter);text-align:left;padding:20px"><b>' + open.length + '</b><span>Still open</span></div>' +
    '<div class="tile" style="background:var(--peach);text-align:left;padding:20px"><b>' + late.length + '</b><span>Late right now</span></div>' +
    '<div class="tile" style="background:var(--mint);text-align:left;padding:20px"><b>' + (approvedAny.length ? Math.round(rft/approvedAny.length*100) + '%' : '—') + '</b><span>Approved right first time</span></div></div>' +
    '<div class="split"><div class="main"><section class="panel"><h2>Projects by stage</h2>' + bars(byStage, maxS) + '</section>' +
    '<section class="panel"><h2>Who’s holding work right now</h2>' + (hold.length ? bars(hold, maxH) : '<p class="meta" style="margin:0">Nobody — everything is moving.</p>') + '</section></div>' +
    '<aside class="side"><section class="pastel" style="background:var(--lilac)"><div class="hd"><span>Why changes were requested</span><span>' + withChanges + ' projects</span></div><div class="bd">' + (rs.length ? rs.map(function(r){ return '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>' + esc(r[0]) + '</span><b>' + r[1] + '</b></div>'; }).join('') : 'No change requests yet. Reasons will show up here as approvers use “Request changes”.') + '</div></section>' +
    '<section class="panel" style="background:#111;color:#FFF"><span style="font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#D9F26B">Baseline · ManageArtworks, 22 Oct 2026</span><div style="font-size:15px;line-height:1.55;color:#E0E0E0">294 projects, 222 still open. 523 of 601 open tasks overdue (87%). 0 of 2 tracked components right first time. 1 of 224 files versioned. Use these to measure the new Library against.</div></section></aside></div>';

    out + '<p class="meta" style="margin:0">CMYK values are a screen-to-print estimate — match against the printer’s proof. AI can miss things: approvers still own the final check.</p></section>';

function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('load')); }; document.head.appendChild(s); }); }
var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function rasterize(f){

  return sb.storage.from('artwork').download(f.path).then(function(r){ if (r.error || !r.data) throw new Error('Couldn’t open the artwork file.'); return r.data; }).then(function(blob){
    var isPdf = /pdf/i.test(blob.type) || /\.pdf$/i.test(f.name);
    if (isPdf){
      var go = window.pdfjsLib ? Promise.resolve() : loadScript(PDFJS + 'pdf.min.js');
      return go.then(function(){

        return blob.arrayBuffer();

        var v1 = page.getViewport({ scale: 1 });
        var scale = Math.min(2200 / Math.max(v1.width, v1.height), 4);
        var vp = page.getViewport({ scale: scale });
        var c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        var ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,c.width,c.height);
        return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function(){ return Promise.all([pdfText(pdfDoc), pdfFonts(pdfDoc).catch(function(){ return null; }), pdfImages(pdfDoc).catch(function(){ return []; })]); }).then(function(a){ return { canvas: c, widthMm: v1.width / 72 * 25.4, heightMm: v1.height / 72 * 25.4, text: a[0], fontInfo: a[1], images: a[2] }; });
      });
    }
    if (!/^image\//.test(blob.type) && !isImg(f)) throw new Error('The check reads PDF, PNG or JPG artwork. Upload one of those as the artwork version.');
    return new Promise(function(res, rej){
      var img = new Image(); img.onload = function(){
        var scale = Math.min(1, 2200 / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        var ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
        res({ canvas: c, widthMm: null, heightMm: null, pxW: img.width, pxH: img.height });

    });

}
function cmykStr(hex){

function rgbStr(hex){ var c = hexToRgb(hex); return c ? 'RGB ' + c.join(' ') : ''; }
function hexToRgb(h){ var m = /^#?([0-9a-f]{6})$/i.exec(String(h).trim()); if (!m) return null; var n = parseInt(m[1],16); return [n>>16&255, n>>8&255, n&255]; }

function dE(a,b){ var A = lab(a), B = lab(b); return Math.sqrt(Math.pow(A[0]-B[0],2)+Math.pow(A[1]-B[1],2)+Math.pow(A[2]-B[2],2)); }

function eanCheck(d){

  function worse(a, b){ var o = { pass: 0, na: 0, warn: 1, fail: 2 }; return o[b] > o[a] ? b : a; }
  if (ctx.widthMm){                                   // PDF
    var imgs = ctx.images || [];
    imgs.sort(function(a, b){ return a.dpi - b.dpi; });
    imgs.slice(0, 12).forEach(function(im){ var g = grade(im.dpi); status = worse(status, g);
      items.push('Image ' + im.px + ' px placed at ' + im.wMm + ' × ' + im.hMm + ' mm → <b>' + im.dpi + ' DPI</b>' + (g === 'pass' ? '' : g === 'warn' ? ' — a bit soft, 300 DPI recommended' : ' — too low, will print blurry')); });
    msg = 'PDF page: ' + Math.round(ctx.widthMm) + ' × ' + Math.round(ctx.heightMm) + ' mm. ' + (imgs.length ? imgs.length + ' placed image' + (imgs.length > 1 ? 's' : '') + ' checked.' : 'No placed photos — all vector, so it prints sharp at any size.');
    if (pw && ph){
      var fits = ctx.widthMm + 0.5 >= pw && ctx.heightMm + 0.5 >= ph, extra = Math.max(ctx.widthMm - pw, ctx.heightMm - ph);
      msg += ' Pack print size: ' + pw + ' × ' + ph + ' mm' + (!fits ? ' — the PDF page is smaller than the pack. Check the artboard size.' : extra > 1 ? ' (page is larger — likely includes bleed).' : ' — matches.');
      if (!fits) status = worse(status, 'warn');
    }
    return { status: status, items: items, message: msg };
  }
  if (ctx.pxW){                                      // PNG / JPG
    var g0 = gcd(ctx.pxW, ctx.pxH), maxW = Math.round(ctx.pxW / 300 * 25.4), maxH = Math.round(ctx.pxH / 300 * 25.4);
    items.push('Image ' + ctx.pxW + ' × ' + ctx.pxH + ' px · ratio ' + (ctx.pxW / g0) + ':' + (ctx.pxH / g0) + ' · prints up to ' + maxW + ' × ' + maxH + ' mm at 300 DPI');
    if (!pw || !ph) return { status: 'warn', items: items, message: 'Add the pack print size (mm) to this project to check whether the image is sharp enough.' };
    var dpi = Math.round(Math.min(ctx.pxW / (pw / 25.4), ctx.pxH / (ph / 25.4)));
    status = grade(dpi);
    items.push('At the pack size of ' + pw + ' × ' + ph + ' mm this gives <b>' + dpi + ' DPI</b>' + (status === 'pass' ? '' : status === 'warn' ? ' — a bit soft, 300 DPI recommended' : ' — too low, will print blurry'));
    var ra = ctx.pxW / ctx.pxH, rb = pw / ph;
    if (Math.abs(ra - rb) / rb > 0.02){ status = worse(status, 'warn'); items.push('Shape doesn’t match the pack (' + ra.toFixed(2) + ' vs ' + rb.toFixed(2) + ') — it will need cropping or extending.'); }
    return { status: status, items: items, message: 'For print, upload the PDF from the designer — PNG/JPG previews are for review only.' };
  }
  return { status: 'na', items: [], message: 'Couldn’t read the artwork size.' };
}

    var done = function(assetId){
      var p = copy(find(id)); var ver = kind === 'artwork' ? (p.version||0) + 1 : (kind === 'source' ? (p.version||1) : null);
      p.files = p.files || []; p.files.push({ kind: kind, name: file.name, path: assetId || null, version: ver, by: S.me, at: nowIso() });
      log(p, 'uploaded ' + ({artwork:'artwork',source:'final file',keyline:'a reference file'}[kind]) + ' ' + file.name);
      save(p); toast('Uploaded ' + file.name + '.');
    };
    var path = id + '/' + Date.now() + '-' + file.name.replace(/[^\w.\-]+/g, '_');
    sb.storage.from('artwork').upload(path, file, { upsert: false, contentType: file.type || undefined }).then(function(r){
      if (r.error){ toast('This file didn’t upload — ' + (r.error.message || 'try again') + '.'); return; }
      done(path);
    });
    return;
  }
});
document.addEventListener('input', function(e){
  if (e.target.id === 'q'){ S.q = e.target.value; render(); var i = document.getElementById('q'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  if (e.target.id === 'libq'){ S.libq = e.target.value; render(); var j = document.getElementById('libq'); if (j){ j.focus(); j.setSelectionRange(j.value.length, j.value.length); } }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && document.querySelector('.modal')) closeModal(); });
window.addEventListener('hashchange', function(){ render(); window.scrollTo(0,0); });

function render(){
  var keep = captureInputs(), whoEl = document.querySelector('.who');
  if (S.mode === 'setpw-required'){
    document.getElementById('nav').innerHTML = ''; whoEl.style.display = 'none';
    document.getElementById('view').innerHTML = viewSetPassword(); return;
  }
  if (S.mode === 'signedout' || S.mode === 'connecting'){
    document.getElementById('nav').innerHTML = ''; whoEl.style.display = 'none';
    document.getElementById('view').innerHTML = viewLogin(); restoreInputs(keep); return;
  }
  whoEl.style.display = '';
  if (S.mode === 'notinvited'){
    document.getElementById('nav').innerHTML = '';
    document.getElementById('view').innerHTML = '<div style="max-width:560px;margin:6vh auto;width:100%"><div class="panel" style="padding:32px;gap:14px"><h1 style="font-size:32px">You\u2019re signed in, but not on the team yet</h1><p class="meta" style="margin:0;font-size:16px">' + esc(S.email) + ' hasn\u2019t been added to the Artwork Library. Ask a Creative lead to add you on the Team page — then refresh this page.</p><button class="btn btn-soft" data-act="signout">Sign out</button></div></div>';
    return;
  }
  var nb = whoEl.querySelector('[data-act=new]'); if (nb) nb.style.display = can('request') ? '' : 'none';
  var r = route(); renderNav(r);
  var v = document.getElementById('view'), html;
  if (r.name === 'p') html = viewProject(r.id);
  else if (r.name === 'projects') html = viewProjects();
  else if (r.name === 'library') html = viewLibrary();
  else if (r.name === 'insights') html = viewInsights();
  else if (r.name === 'team') html = viewTeam();
  else if (r.name === 'password') html = viewSetPassword();
  else html = viewWork();
  v.innerHTML = html;
  restoreInputs(keep);
}

S.me = null;
fillMe(); render(); connect();
})();
</script>

</body>
